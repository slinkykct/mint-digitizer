name: Build Windows EXE

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt
          python -m pip install pyinstaller>=6.0

      - name: Build EXE
        run: python build_windows_exe.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: MazeIntDigitizer-Windows
          path: dist/MazeIntDigitizer.exe

      - name: Create release archive
        if: startsWith(github.ref, 'refs/tags/')
        run: |
          Compress-Archive -Path dist\MazeIntDigitizer.exe -DestinationPath MazeIntDigitizer-Windows.zip

      - name: Upload release asset
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            MazeIntDigitizer-Windows.zip
